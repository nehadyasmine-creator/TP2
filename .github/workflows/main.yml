name: CI devops 2025

on:
  push:
    branches: 
      - main
      - develop
  pull_request:

jobs:
  test-backend:
    runs-on: ubuntu-24.04
    steps:
      # 1. Récupérer le code source du dépôt
      - uses: actions/checkout@v4
      
      # 2. Configurer Java JDK 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'
      
      # 3. Compiler et exécuter les tests avec Maven (en ciblant le dossier simpleapi)
      - name: Build and test with Maven
        run: mvn clean verify --file backend/simpleapi/simpleapi/pom.xml
