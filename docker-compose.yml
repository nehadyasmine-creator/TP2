services:
  database:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mon-postgres-container
    networks:
      - back-net
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend/simpleapi/simpleapi
      dockerfile: Dockerfile
    container_name: my-api-container
    networks:
      - back-net
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${POSTGRES_DB}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped

  httpd:
    build:
      context: ./Httpd
      dockerfile: Dockerfile
    container_name: my-httpd-container
    networks:
      - front-net
      - back-net
    environment:
      - BACKEND_HOST=${BACKEND_HOST}
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

networks:
  front-net:
    driver: bridge
  back-net:
    driver: bridge

volumes:
  pgdata: